schema_version: "1.0"
last_verified_utc: "2026-08-25T00:00:00Z"

governance:
  purpose: >-
    Train and evaluate a cross-domain backhaul-policy prototype using only
    observed public records and explicitly documented derived labels.
  raw_directory: "data_sources/raw"
  raw_git_policy: "ignored"
  synthetic_feature_rows: "prohibited"
  cross_source_record_joins: "prohibited"
  same_source_grouping: >-
    Allowed only when the source itself provides the operational cohort key,
    such as Amazon station and service date.
  source_batching: >-
    Each training minibatch belongs to exactly one source. Dataset-specific
    task masks activate only labels observed or derived within that source.
  required_per_sample_fields:
    - source_id
    - sample_id
    - split_group_or_route_group
  required_per_split_manifest_fields:
    - processed_sha256
    - row_count
    - sample_id_order_sha256
    - group_set_sha256
  required_per_source_manifest_fields:
    - raw_artifact_id
    - raw_sha256
    - observed_and_derived_target_description
  permitted_label_origins:
    - observed
    - same_source_derived
    - same_source_solver_derived
  permitted_usage_status:
    - core_training
    - external_audit_only
    - candidate_not_used_by_current_model
  prohibited_claims:
    - "Field-validated Haulio performance"
    - "Causal empty-kilometre reduction"
    - "Calibrated Indonesian truckload price"
    - "Learned device authentication"
    - "One joined public end-to-end Haulio validation set"

sources:
  singapore_commercial_vehicle:
    usage_status: "core_training"
    title: "Singapore commercial vehicle GPS, OBD, payload, fuel use data"
    publisher: "Figshare"
    citation: >-
      Cheah, Lynette (2019). Singapore commercial vehicle GPS, OBD, payload,
      fuel use data. figshare. Dataset.
      https://doi.org/10.6084/m9.figshare.9741035.v2
    landing_url: "https://figshare.com/articles/dataset/Singapore_commercial_vehicle_GPS_OBD_payload_fuel_use_data/9741035"
    metadata_url: "https://api.figshare.com/v2/articles/9741035"
    download_url: "https://ndownloader.figshare.com/files/24337976"
    artifact_id: "figshare:24337976"
    artifact_name: "figshare_TRR.zip"
    expected_bytes: 46804275
    license:
      name: "CC BY 4.0"
      url: "https://creativecommons.org/licenses/by/4.0/"
      raw_redistribution: "only under source license with attribution"
    domain: "commercial road vehicles; six HGV and four LGV in Singapore"
    observed_inputs:
      - timestamp_GMTplus8
      - speed_kmh
      - engine_status
      - TripID
      - road_grade_proportion
      - engine_load_obd_percent
      - mass_air_flow_g_per_s
      - instantaneous_fuel_L_per_s
      - payload_StartTime_and_EndTime_for_six_vehicles
      - payload_Pickup_type_and_Pickup_volume_for_six_vehicles
      - payload_Deliver_type_and_Deliver_volume_for_six_vehicles
      - trip_level_OBD_Fuel_used_L
    allowed_labels:
      - name: "instantaneous_fuel_L_per_s"
        origin: "same_source_derived_by_publisher_from_OBD_engine_load_and_mass_air_flow"
      - name: "OBD - Fuel used (L)"
        origin: "same_source_derived_by_publisher_from_instantaneous_fuel_stream"
      - name: "future_half_idle_heavy_class"
        origin: "same_source_derived_from_observed_future_engine_state"
      - name: "trip_duration"
        origin: "same_source_derived_from_timestamps"
      - name: "coarse_load_state_transition"
        origin: "same_source_derived_from_driver_activity_survey"
        current_checkpoint: false
    allowed_tasks:
      - fuel_prediction
      - engine_and_idle_state
      - remaining_trip_duration
      - coarse_empty_or_loaded_state
    current_checkpoint_tasks:
      - first_half_to_full_trip_fuel_prediction
      - first_half_to_full_trip_duration_prediction
      - future_half_idle_heavy_classification
    current_checkpoint_exclusions:
      - "instantaneous_fuel_L_per_s is excluded from inputs because it is integrated into the fuel target"
      - "coarse payload survey responses are retained as provenance only; no load target or load-state prediction is trained"
    gaps:
      - "Latitude and longitude are intentionally removed."
      - "Payload answers are coarse categories, not load-cell kilograms."
      - "Vehicles A, E, F, and H have no payload survey."
      - "The initial onboard load is unknown, and free-text volume units are inconsistent."
      - "Fuel fields are publisher calculations from OBD signals, not a calibrated fuel-flow meter."
      - "At least five working days per vehicle is too small for deployment calibration."

