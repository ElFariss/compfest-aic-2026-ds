services:
  backhaul-policy:
    build: .
    command: ["python", "service.py", "--host", "0.0.0.0", "--port", "8088", "--artifacts", "artifacts"]
    ports:
      - "127.0.0.1:8088:8088"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3).read()"]
      interval: 10s
      timeout: 4s
      retries: 5
